guards:
  secrets: true
  lint: true
  tests: true
  test_mode: diff
  # PINNED INTERPRETER (tick #289): the suite imports tomllib (3.11+) while the
  # standard GitReins invocation puts the gitreins venv first on PATH — that venv
  # is Python 3.10, so a bare `pytest` collected the tree under 3.10 and died with
  # ModuleNotFoundError: No module named 'tomllib' (guard log guard-20260919T005837).
  # Pinning the repo venv here makes the tests lane independent of PATH ordering.
  test_command: .venv/bin/python -m pytest -x --tb=short
  static_analysis: true
  # TJ-DF-043 (2026-10-02): the suite grew past the engine-default test_timeout
  # (180s) — measured standalone runs: 511s (load 25), 515s, 848s (load 25-50).
  # The engine's own timeout message prescribes this knob; 900 is the
  # fleet-proven rung (gitreins' own config). hook_timeout (the WHOLE-run
  # budget, default 300s) must rise with it: raising test_timeout alone moves
  # the kill into the hook budget, and the smaller budget wins — a commit that
  # lands on the hook-timeout FAIL-OPEN early-return is NOT gate-verified.
  # 1200 covers the 900s tests lane plus secrets/lint/static.
  test_timeout: 900
  hook_timeout: 1200
  # TRUST-001 default for a repo whose ticks commit board data (.coding-hermes/**)
  # and harness records only: a DEGENERATE run (no gradable staged file, so lint
  # and tests legitimately skip) exits 0 instead of blocking the commit. A gate
  # that RUNS and fails is unaffected — gitreins only honours this for a degraded
  # result (cli.py: exit 1 when `result.degraded and not allow_skips`), and CI
  # plus `gitreins guard --full` still grade the whole tree on every push.
  allow_skips: true
evaluator:
  max_iterations: 300  # TICK-312: 200 exhausted on REVIEW-TJ-002 (5-row blocked-premise audit) -> INCOMPLETE by cap
  max_time: 135m  # 90m exhausted on RELTOOL (a2537729) INCOMPLETE-by-cap; prior: 60m exhausted on TJ-DF-029 (ff0ddbe3)
  # TIME RUNG (tick #302): the DF-TERMINAL-JAIL-31 tier2 judge hit `Time cap (45m)
  # exceeded (45m5s elapsed)` -> INCOMPLETE with 4/5 criteria PASS, but that run
  # was executed CONCURRENTLY with the DF-TERMINAL-JAIL-23 judge on the same box
  # (two judges, one repo, plus the fleet load) — wall-clock starvation, not a
  # criteria cost problem. Raise the rung to the fleet-proven 60m AND run judge
  # jobs SERIALLY in this repo; never parallelize `gitreins judge --async`.
  # RUNG (tick #289): the DF-TERMINAL-JAIL-16 tier2 judge starved at the OLD 2M
  # rung — `Cap exceeded: Input token budget (2.0M) exceeded (2.0M used)`, verdict
  # 933b300c INCOMPLETE, tier1 PASS (usage.jsonl tier2 row: 2,035,763 tokens_in).
  # used == cap is STARVATION, not the model window: deepseek-v4-flash is 1M per
  # call. RUNG HISTORY: 2M (#289) -> 8M (fleet-proven for live-verification sets)
  # -> 12M (tick #308, 1.5x step per cached answer 2269): the INT-CI-001 judge hit
  # `Cap exceeded: Input token budget (8.0M) exceeded (8.1M used)` -> INCOMPLETE
  # with tier1 PASS, no criteria split — same starvation signature, one rung up.
  # -> 18M (tick #330, 1.5x step): the TJ-DF-029 judge hit the resource cap
  # during its full-suite wrap-up -> INCOMPLETE with all 6 criteria already
  # verified PASS in detail (verdict 83255120). Starvation signature, one rung up.
  max_input_tokens: 18M
  max_output_tokens: 0.4M
  tool_call_weight: 0.1
  fast_track: auto
  # file_scope: changed grades the WORKING-TREE diff, but this repo's judged work
  # is normally COMMITTED before `task complete`, so the scope collapsed to
  # nothing and the judge re-read the artifact through shell/git slices, re-sent on
  # every iteration — the token half of the same starvation. `full` gives the judge
  # the tree it is grading.
  file_scope: full
  code_context_budget: 0.70
  compaction_threshold: 0.90
defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY
history:
  enabled: true
  storage: git
  max_verdicts: 1000
