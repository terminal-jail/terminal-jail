[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-jail"
version = "1.2.0"
description = "Wrap Hermes terminal commands in a Linux PID namespace using unshare"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Total Windup Flight Systems" },
]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
keywords = ["hermes", "plugin", "terminal", "security", "sandbox"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/terminal-jail/terminal-jail"
Repository = "https://github.com/terminal-jail/terminal-jail"

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.8"]

[tool.setuptools.packages.find]
where = ["plugin"]
include = ["terminal_jail*"]

[tool.setuptools.package-data]
"terminal_jail" = ["rules/*.yaml"]

[tool.pytest.ini_options]
markers = [
    "standalone_cli: tests for standalone/terminal-jail CLI script",
    "integration: tests requiring real unshare (skip on hosts that block --mount-proc)",
]
testpaths = ["plugin", "tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
