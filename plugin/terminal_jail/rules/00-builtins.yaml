# terminal-jail default built-in rules
# Shipped default rules file — installed by ./install.sh to
# ~/.config/terminal-jail/rules.d/00-builtins.yaml (user rules dir the engine
# loads); root-managed deployments may place it in /etc/terminal-jail/rules.d/.
# Priority 1000 = critical blocklist, 700 = auto-sandbox, 500 = always-allow
# These reflect the same 54 rules hardcoded in the Python engine
# (35 blocklist / 9 sandbox / 10 allow). Rule ids AND pattern strings must stay
# byte-identical to the engine constants: install.sh copies this file into the
# user rules dir, where same-id override REPLACES the builtin.

rules:
  # =============================================================================
  # Critical Blocklist (priority 1000) — ALWAYS block, never override to allow
  # =============================================================================
  - id: "builtin-kill-all"
    description: "Mass process kill"
    priority: 1000
    action: block
    block_message: "Mass process kill (kill -9 -1) is blocked."
    match:
      type: pattern
      # Mass-kill invariant: in `kill` syntax, signal specs come first,
      # then pid operands. `-1` is a MASS-KILL PID when it is NOT the
      # first operand (kill 123 -1, kill -9 -1, kill -1 -1) or when
      # preceded by `--` (kill -- -1); `-1` in first-operand position is
      # a SIGNAL (kill -1 123 = SIGHUP, benign). Requires at least one
      # operand before the pid `-1`, excludes `-1` as the argument of
      # -s/-n/-l (not a pid), and ends at a token/segment boundary so
      # compound forms (kill -- -1; echo x) still match. (?<!\S) =
      # token-start boundary (plain \b never sits between a space and a
      # dash); IGNORECASE covers -TERM/-SIGKILL.
      pattern: "(?<![A-Za-z0-9])kill\\s+(?:-s\\s+\\S+\\s+|-n\\s+\\S+\\s+|--\\s+|-(?!l)\\S+\\s+|\\d+\\s+)+(?<!-s\\s)(?<!-n\\s)(?<!\\S)-1(?:\\s|;|\\||&|\\)|`|$|[\\\"'])"

  - id: "builtin-killpg-pid1"
    description: "Process-group kill targeting PID 1 or own process group (killpg API)"
    priority: 1000
    action: block
    block_message: "Process-group kill targeting PID 1 or own process group (killpg(0/1, ...)) is blocked — this is the MagicMock incident vector."
    match:
      type: pattern
      pattern: "(os\\.killpg|killpg)\\s*\\(\\s*[01]\\s*,|os\\.kill\\s*\\(\\s*[01]\\s*,|process\\.kill\\s*\\(\\s*-?[01]\\s*,|kill\\(-?[01],|kill\\s*\\(\\s*[01]\\s*,\\s*(9|SIGKILL)"

  - id: "builtin-fork-bomb"
    description: "Fork bomb pattern (any function name, not just ':')"
    priority: 1000
    action: block
    block_message: "Fork bomb pattern detected and blocked."
    match:
      type: pattern
      # TJ-GAP-053: named-func variants (bomb(){ bomb|bomb & };bomb)
      # passed the classic pattern — generalized via backreference.
      # Guards are LOOKAROUNDS not \b (':' is non-word; classic form stays caught).
      pattern: "([A-Za-z_]\\w*|:)\\s*\\(\\s*\\)\\s*\\{[^}]*(?<![\\w:])\\1\\s*\\|\\s*\\1(?![\\w:])[^}]*&[^}]*\\}\\s*;\\s*\\1(?![\\w:])"

  - id: "builtin-rm-rf-root"
    description: "Recursive root filesystem removal"
    priority: 1000
    action: block
    block_message: "Recursive root directory removal (rm -rf /) is blocked."
    match:
      type: pattern
      # Root-scoped recursive-delete rule (TJ-DF-001): order-independent
      # flag set via two lookaheads (recursive: -r/-R/--recursive, combined
      # short flags like -rf/-fr OK; force: -f/--force), target must be
      # exactly "/" or "/*". Catches rm -rf --no-preserve-root /, rm -r -f /,
      # rm --recursive --force /, rm -rf/. (?<!\S) = token-start boundary
      # (plain \b never sits between a space and a dash); IGNORECASE covers -R.
      # TJ-GAP-042: target boundary extended to quotes/parens/backtick so
      # quoted/embedded forms (python3 -c "...", bash -c '...') also match.
      pattern: "\\brm\\s+(?=[^|;&]*(?<!\\S)(?:-[a-z]*r[a-z]*|--recursive)\\b)(?=[^|;&]*(?<!\\S)(?:-[a-z]*f[a-z]*|--force)\\b)[^|;&]*\\s*/(?:\\*)?(?:\\s|$|[\\\"')`])"

  - id: "builtin-dd-root"
    description: "Raw device write via dd"
    priority: 1000
    action: block
    block_message: "Raw device writes (dd to /dev/*) are blocked."
    match:
      type: pattern
      pattern: "dd\\s+.*of=/dev/"

  - id: "builtin-mkfs"
    description: "Filesystem creation"
    priority: 1000
    action: block
    block_message: "Filesystem creation commands (mkfs.*) are blocked."
    match:
      type: pattern
      pattern: "mkfs(?:\\.|\\s+\\.)"

  - id: "builtin-fdisk"
    description: "Partition manipulation"
    priority: 1000
    action: block
    block_message: "Partition manipulation (fdisk, parted, gdisk) is blocked."
    match:
      type: pattern
      pattern: "fdisk|parted|gdisk"

  - id: "builtin-chmod-777-root"
    description: "World-writable absolute path"
    priority: 1000
    action: block
    block_message: "Blocked: chmod making a path world-writable — mode `777`, `7777` or `a+rwx`, with `-R`/`--recursive` optional. The rule matches by SCOPE, not by root: it fires on ANY absolute (`/`-rooted) target — `/tmp/work`, `/var/www`, `/etc` — not only root (`/`). Relative (`chmod 777 work`) and `~`-rooted (`chmod 777 ~/work`) targets keep their ALLOW verdict, as do non-world-writable modes on absolute paths (`chmod 755 /`). Override this id to warn level with a same-id user rule in `~/.config/terminal-jail/rules.d/` if a legitimate workflow needs a world-writable absolute path."
    match:
      type: pattern
      # World-writable mode on a /-rooted path (TJ-DF-011): mode token
      # (777, 7777, or a+rwx) matched order-independently via a lookahead,
      # recursive flag (-R/--recursive) via an OPTIONAL second lookahead —
      # plain `chmod 777 /` must still block. Target keeps the old \\s+/
      # semantics: ANY /-rooted path (e.g. /var/www) blocks, intentional
      # and tested. (?<!\\S) = token-start boundary (plain \\b never sits
      # between a space and a dash); IGNORECASE covers -R.
      pattern: "\\bchmod\\s+(?=[^|;&]*(?<!\\S)(?:7777|777|a\\+rwx)\\b)(?=[^|;&]*(?<!\\S)(?:-[a-z]*r[a-z]*|--recursive)\\b)?[^|;&]*\\s+/"

  - id: "builtin-echo-to-system"
    description: "Redirect output to system paths"
    priority: 1000
    action: block
    block_message: "Writing to system paths (/etc/, /boot/) is blocked."
    match:
      type: pattern
      pattern: ">\\s*/etc/|>>\\s*/etc/|>\\s*/boot/|>>\\s*/boot/"

  - id: "builtin-curl-pipe-shell"
    description: "Curl/wget piping to shell"
    priority: 1000
    action: block
    block_message: "Piping downloads directly to a shell is blocked. Use package managers instead."
    match:
      type: pattern
      pattern: "(curl|wget)\\b.*\\|\\s*(bash|sh|dash|zsh)"

  - id: "builtin-sudo"
    description: "Privilege escalation via sudo/doas/su/pkexec"
    priority: 1000
    action: block
    block_message: "Privilege escalation (sudo/doas/su/pkexec) is blocked in the sandbox."
    match:
      type: pattern
      # TJ-GAP-053: sudo was the only covered escalator; doas/su/pkexec
      # passed (probe 2026-09-16). \bsu\s requires whitespace so sudo/
      # support/setuptools substrings never match.
      pattern: "\\b(?:sudo|doas|pkexec|su)\\s"

  - id: "builtin-code-injection"
    description: "Code-injection vectors in interpreter arguments (os.system, os.popen, shutil.rmtree, subprocess, eval, exec, __import__)"
    priority: 1000
    action: block
    block_message: "Code-injection vectors (os.system/os.popen/shutil.rmtree/subprocess/eval/exec/__import__) are blocked — quoted interpreter code is scanned, not just shell syntax."
    match:
      type: pattern
      # TJ-GAP-042: destructive code inside QUOTED interpreter arguments
      # (python3 -c '...os.system("rm -rf /")...', eval(...)) previously
      # passed as ALLOW — same design as builtin-killpg-pid1 (block on
      # presence anywhere in the raw command string). Spec T-I33
      # ("heuristic detection") was parser-only; now a real block rule.
      pattern: "\\b(os\\.system|os\\.popen|shutil\\.rmtree|subprocess\\.(?:call|run|Popen|check_call|check_output))\\s*\\(|\\b(eval|exec|__import__)\\s*\\("

  - id: "builtin-indirect-shell"
    description: "Encoded/piped shell execution (base64 -d | sh, printf-decode | bash)"
    priority: 1000
    action: block
    block_message: "Decode-then-execute pipelines (base64/printf | sh) are blocked — the firewall cannot inspect what runs."
    match:
      type: pattern
      # TJ-GAP-053 wave (probe 2026-09-16): base64-pipe-shell passed as ALLOW.
      pattern: "\\bbase64\\s+[^|;]*\\|\\s*(bash|sh|dash|zsh|ksh)\\b|\\b(printf|echo)\\b[^|;]*\\\\x[0-9a-f]{2}[^|;]*\\|\\s*(bash|sh|dash|zsh|ksh)\\b"

  - id: "builtin-vm-delete"
    description: "Bulk unlink or arbitrary execution via find (-delete / -exec / -ok)"
    priority: 1000
    action: block
    block_message: "find -delete / -exec bulk or arbitrary-command execution is blocked."
    match:
      type: pattern
      # Any find arming -delete/-exec/-ok; plain finds (reads) stay allowed.
      pattern: "\\bfind\\s[^|;&]*\\s-(?:delete|exec|execdir|ok)\\b"

  - id: "builtin-device-write"
    description: "Raw device writes outside dd (shred, wipefs, blkdiscard, urandom redirects)"
    priority: 1000
    action: block
    block_message: "Raw block-device writes (shred/wipefs/cat > /dev/sd*) are blocked."
    match:
      type: pattern
      pattern: "\\b(?:shred|wipefs|blkdiscard)\\b[^|;&]*\\s/dev/|>\\s*/dev/(?:sd[a-z]|nvme\\d|hd[a-z]|vd[a-z]|mmcblk\\d)"

  - id: "builtin-ns-escape"
    description: "Namespace/jail escape tooling (nsenter into a foreign PID, chroot, setpriv to uid 0, unshare -r)"
    priority: 1000
    action: block
    block_message: "Namespace escape tooling (nsenter -t <pid>, chroot, setpriv/setuid to 0) is blocked."
    match:
      type: pattern
      # setpriv arming flags: \b cannot sit between whitespace and `--`,
      # so the flags are matched directly (fixes setpriv probe gap).
      pattern: "\\bnsenter\\s[^|;&]*-t\\s|\\bchroot\\s|\\bsetpriv\\s[^|;&]*--(?:reuid|setuid|clear-groups)\\b|\\bunshare\\s[^|;&]*-r\\b"

  - id: "builtin-persistence"
    description: "Persistence install (crontab write, cron spool, rc.local, systemd unit drop)"
    priority: 1000
    action: block
    block_message: "Persistence writes (crontab -, /etc/cron*, rc.local, systemd units) are blocked."
    match:
      type: pattern
      # `crontab -l` (read) stays allowed; only WRITE forms match.
      # Trailing `crontab -` (EOF-terminated write) needs the (?:\s|$) arm.
      pattern: "\\bcrontab\\s+(?:-(?:\\s|$)|-l?\\s*<|-[a-z]*\\s*/etc/)|/etc/cron\\.(?:d|daily|hourly)/|/etc/rc\\.local\\b|/etc/systemd/system/[^|;&]*\\.(?:service|timer)\\b"

  - id: "builtin-script-killall"
    description: "killall/pkill with SIGKILL (mass-kill by process name)"
    priority: 1000
    action: block
    block_message: "killall/pkill -9 is blocked (mass kill by name). Non-KILL killall/pkill is allowed for legit restarts."
    match:
      type: pattern
      pattern: "\\b(?:killall|pkill)\\s+(?:-[a-zA-Z]*9[a-zA-Z]*\\s|--signal\\s*(?:SIGKILL|9)\\s|--kill\\s)"

  - id: "builtin-interpreter-escape"
    description: "Interpreter destruction APIs (perl/ruby/node/python: unlink, rmtree, rm_rf, rmSync, execSync-masskill, fork loops)"
    priority: 1000
    action: block
    block_message: "Interpreter destruction APIs (unlink/rm_rf/rmSync/execSync-masskill/os-fork-loop) are blocked — same design as the code-injection rule."
    match:
      type: pattern
      # child_process.exec/execSync arms only when a kill/rm shape sits in
      # the SAME command string (probe 2026-09-16: node-exec-kill).
      pattern: "\\bperl\\b[^|;&]*\\bunlink\\b|\\bperl\\b[^|;&]*\\brmtree\\b|FileUtils\\.rm_rf\\(|\\brmSync\\s*\\(|child_process\\.(?:exec|execSync)\\s*\\([^)]*(?:kill|rm)\\b|os\\.fork\\s*\\(\\s*\\)\\s*(?:while|for)|while\\s+[^;\\n]*:\\s*os\\.fork\\s*\\("

  - id: "builtin-self-rewrite"
    description: "Self-modification vectors (rm/mv/redirect on terminal-jail's own rules and config)"
    priority: 1000
    action: block
    block_message: "Rewriting terminal-jail's own rules/config is blocked."
    match:
      type: pattern
      pattern: "\\brm\\s+[^|;&]*terminal-jail/(?:rules|00-builtins)|\\bmv\\s+[^|;&]*\\s[^|;&]*terminal-jail/rules|\\bcat\\s+[^|;&]*>\\s*/etc/terminal-jail/|>\\s*~/.config/terminal-jail/rules"

  - id: "builtin-var-indirection"
    description: "Variable-indirection shell destruction (D=/; rm -rf $D and friends)"
    priority: 1000
    action: block
    block_message: "Variable-indirection destructive forms (var=/ then rm -rf $var) are blocked."
    match:
      type: pattern
      # Root assigned to a var, then an rm of that var — the var must be a
      # bare `/` or `/*` assignment to qualify as root-scoped.
      pattern: "\\b[A-Za-z_]\\w*=/\\s*;\\s*rm\\s+(?=[^|;&]*-[a-zA-Z]*r)|\\b[A-Za-z_]\\w*=/\\*\\s*;\\s*rm\\s+(?=[^|;&]*-[a-zA-Z]*r)"

  # ---------------------------------------------------------------------------
  # TJ-GAP-058 network egress (probe 2026-09-16): reverse-shell shapes BLOCK,
  # dual-use egress is auto-sandboxed (see the sandbox section below).
  # ---------------------------------------------------------------------------
  - id: "builtin-net-devtcp-redirect"
    description: "Network-fd redirect reverse shell (/dev/tcp, /dev/udp)"
    priority: 1000
    action: block
    block_message: "Reverse shell through a network file descriptor (redirect into /dev/tcp/... or /dev/udp/...) is blocked."
    match:
      type: pattern
      # Requires a redirect operator bound to the fd path, so a mere mention
      # inside a string/argument is not matched. Operators longest-first.
      pattern: "(?:&>|>&|>>|<>|<<|>|<)\\s*/dev/(?:tcp|udp)/\\S"

  - id: "builtin-net-mkfifo-reverse-shell"
    description: "mkfifo feedback-loop reverse shell (fifo + shell + network client)"
    priority: 1000
    action: block
    block_message: "mkfifo feedback-loop reverse shell is blocked — a fifo wired from a shell into a network client is the canonical two-way shell."
    match:
      type: pattern
      # Both halves (a shell AND a pipe into a network client) must appear in
      # the same command string; a lone mkfifo stays allowed. Lookaheads cross
      # ; and | because the vector is a multi-segment command.
      pattern: "\\bmkfifo\\b(?=[\\s\\S]*(?<![\\w/.-])(?:/bin/|/usr/bin/)?(?:sh|bash|dash|ksh)\\b)(?=[\\s\\S]*\\|\\s*(?:nc|ncat|netcat|socat)\\b)"

  - id: "builtin-net-nc-shell-attach"
    description: "netcat/ncat with a shell attach (-e/-c/--exec or a shell on either side of a pipe)"
    priority: 1000
    action: block
    block_message: "netcat/ncat with a shell attach (-e / -c / --exec, or a shell piped to/from the connection) is blocked — that is a reverse shell, not a port check."
    match:
      type: pattern
      # Arms: (1) -e/--exec/--sh-exec, (2) ncat -c <shell>, (3) connection
      # piped INTO a shell, (4) shell piped INTO the connection (host+port
      # required). `nc -z host port` port checks stay allowed.
      pattern: "(?<![\\w.-])(?:nc|ncat|netcat)\\s[^|;&]*(?<![\\w-])(?:--exec|--sh-exec|-e)\\b|(?<![\\w.-])(?:nc|ncat|netcat)\\s[^|;&]*(?<![\\w-])-c\\s+(?:/bin/|/usr/bin/)?(?:sh|bash|dash|zsh|ksh)\\b|(?<![\\w.-])(?:nc|ncat|netcat)\\b[^|;&]*\\|\\s*(?:/bin/|/usr/bin/)?(?:bash|sh|dash|zsh|ksh)\\b|(?<![\\w/.-])(?:/bin/|/usr/bin/)?(?:bash|sh|dash|zsh|ksh)\\b(?:\\s+(?:-\\S+|\\d?>&?\\d+))*\\s*\\|\\s*(?:nc|ncat|netcat)\\s+(?:-\\S+\\s+)*\\S+\\s+(?:\\d+|\\$\\S+)"

  - id: "builtin-net-socat-exec"
    description: "socat EXEC:/SYSTEM: wired to a network endpoint"
    priority: 1000
    action: block
    block_message: "socat wired to EXEC:/SYSTEM: over a network address is blocked — it spawns a remote-command shell over the socket."
    match:
      type: pattern
      # Both halves required in the same segment: a relay/listener without
      # EXEC:/SYSTEM: stays allowed.
      pattern: "(?<![\\w.-])socat\\s+(?=[^|;&]*(?<![\\w-])(?:exec|system):)(?=[^|;&]*(?<![\\w-])(?:tcp|udp|sctp|openssl)(?:4|6)?(?:-listen|-connect|-recvfrom|-sendto)?:)"

  - id: "builtin-net-openssl-pipe-shell"
    description: "openssl s_client piped into a shell"
    priority: 1000
    action: block
    block_message: "Piping an openssl s_client TLS session into a shell is blocked — a bare s_client diagnostic (no shell pipe) stays allowed."
    match:
      type: pattern
      # Pipe target must be a shell; TLS-inspection pipelines stay allowed.
      pattern: "(?<![\\w.-])openssl\\s+s_client\\b[^|;&]*\\|\\s*(?:/bin/|/usr/bin/)?(?:bash|sh|dash|zsh|ksh)\\b"

  # ---------------------------------------------------------------------------
  # DF-TERMINAL-JAIL-16 raw-socket file exfiltration. TJ-GAP-058 blocked the
  # shell-ATTACH shapes; these two cover the data-out half: a bare raw-socket
  # client (nc/ncat/netcat/socat) that receives a LOCAL FILE payload. They are
  # BLOCK rules, so the decider's whole-command pass settles them before the
  # per-segment allowlist can approve a pipeline's `cat` source.
  # ---------------------------------------------------------------------------
  - id: "builtin-net-file-exfil-pipe"
    description: "Local-file reader piped into a bare raw-socket client (file exfiltration)"
    priority: 1000
    action: block
    block_message: "Raw-socket file exfiltration is blocked: a local-file reader (cat, dd, tar, gzip, base64, xxd, od, strings) piped into a bare raw-socket network client (nc, ncat, netcat, socat). The rule matches by SHAPE — it also fires on non-secret files — and it does not cover ssh/scp/rsync/git push, inline or command-generated payloads (echo ... | nc), or interpreter sockets."
    match:
      type: pattern
      # <reader> <operand> (| stage)* | <raw client> <args>. Word-bounded reader
      # set (concat/odd/substrings never match); the reader must carry a
      # non-operator operand, so a bare `base64 | nc host port` is not matched.
      # A command chain (`&&`, `;`, bare `&`) stops the match; an fd merge
      # (`2>&1`) is tolerated; up to 3 pipes may sit between reader and client.
      pattern: "(?<![\\w.-])(?:cat|dd|tar|gzip|base64|xxd|od|strings)\\s+[^\\s|;&](?:(?:(?!&&)[^|;&]|(?<=\\d)>&?\\d)*\\|&?){0,3}(?:(?!&&)[^|;&]|(?<=\\d)>&?\\d)*(?<![\\w.-])(?:nc|ncat|netcat|socat)\\s"

  - id: "builtin-net-file-exfil-redirect"
    description: "Bare raw-socket client fed a local file by an input redirect"
    priority: 1000
    action: block
    block_message: "Raw-socket file exfiltration is blocked: a bare raw-socket network client (nc, ncat, netcat, socat) taking its payload from a local-file redirect (`< <file>`). The rule matches by SHAPE — it also fires on non-secret files; `/dev/null` and `/dev/stdin` sources are excluded — and it does not cover ssh/scp/rsync/git push, inline or command-generated payloads, or interpreter sockets."
    match:
      type: pattern
      # <raw client> <args> < <file>. Plain `<` only (`<<` heredocs and `<&` fd
      # duplications excluded); `/dev/null` and `/dev/stdin` sources excluded,
      # so `nc host port < /dev/null` keeps its ALLOW verdict.
      pattern: "(?<![\\w.-])(?:nc|ncat|netcat|socat)\\s[^|;&]*(?<!<)<(?!<|&)\\s*(?!/dev/(?:null|stdin)(?![\\w.-]))\\S"

  # ---------------------------------------------------------------------------
  # DF-TERMINAL-JAIL-17 interpreter egress. DF-TERMINAL-JAIL-16 blocked the
  # raw-socket half of data-out; the INTERPRETER half was still default-allow:
  # a `python3 -c` reverse shell built on socket + fd duplication, and a
  # urllib/requests upload whose body is a local file. Blocklist rules are
  # matched against the WHOLE command string first (then per segment), so a
  # `sh -c` / `bash -c` wrapper around the same payload needs no separate rule.
  # Both halves of the transfer must be present for every rule, so harmless
  # interpreter one-liners keep their ALLOW verdict. Patterns are byte-identical
  # to the engine constants (gated by scripts/yaml-mirror-parity-probe.py).
  # ---------------------------------------------------------------------------
  - id: "builtin-interp-egress-socket-shell"
    description: "Interpreter socket reverse shell (socket connect + fd duplication / pty)"
    priority: 1000
    action: block
    block_message: "Interpreter reverse shell is blocked: a Python socket is created and connected, then wired into a duplicated file descriptor or pty (`socket.socket()`/`create_connection()` + `.connect(` + `os.dup2(`/`pty.spawn(`). The rule matches by SHAPE — a plain socket client with no fd handoff is NOT matched — and it does not cover Perl/Ruby/Node sockets, nc/socat (separate rules), a `subprocess` fd handoff (already blocked by builtin-code-injection), or an API name hidden behind an indirection."
    match:
      type: pattern
      # socket constructor + connect + fd-handoff (`os.dup2(`/`dup2(`/`pty.spawn(`).
      # The fd-handoff half deliberately excludes `subprocess` (already blocked by
      # builtin-code-injection), so one vector has one stable rule id.
      pattern: "(?=[\\s\\S]*(?:\\bsocket\\.(?:socket|create_connection)\\s*\\(|\\bsocket\\s*\\(\\s*\\)))(?=[\\s\\S]*(?:\\.connect\\s*\\(|create_connection\\s*\\())(?=[\\s\\S]*(?:\\b(?:os\\.)?dup2\\s*\\(|\\bpty\\.spawn\\s*\\())"

  - id: "builtin-interp-egress-socket-file"
    description: "Interpreter raw-socket send of a local file (file exfiltration)"
    priority: 1000
    action: block
    block_message: "Interpreter file exfiltration is blocked: a Python socket is connected and `send`/`sendall`/`sendfile` is handed a LOCAL-FILE read or file object (`open(...).read()`, `open(..., 'rb')`, `read_bytes()`, `read_text()`). The rule matches by SHAPE — it also fires on non-secret files — and it does not cover a payload built in memory (`sendall(b'…')`) or a file read served through another library."
    match:
      type: pattern
      # socket constructor + `send`/`sendall` + a LOCAL-FILE read.
      # In-memory payloads (`sendall(b'...')`) stay allowed.
      pattern: "(?=[\\s\\S]*(?:\\bsocket\\.(?:socket|create_connection)\\s*\\(|\\bsocket\\s*\\(\\s*\\)))(?=[\\s\\S]*\\.send(?:all|file)?\\s*\\()(?=[\\s\\S]*(?:open\\s*\\([^)]*\\)\\s*\\.read(?:lines)?\\s*\\(|open\\s*\\([^)]*,\\s*['\\\"][rb]{1,2}['\\\"]|read_bytes\\s*\\(|read_text\\s*\\())"

  - id: "builtin-interp-egress-http-file"
    description: "Interpreter HTTP upload of a local file (file exfiltration)"
    priority: 1000
    action: block
    block_message: "Interpreter file exfiltration is blocked: an HTTP client call (urlopen / requests.post|put|patch / httpx.post|put|patch / http.client / urllib.request.Request / `<conn>.request('POST', …)`) is given a LOCAL-FILE read as its body (`open(...).read()`, `open(..., 'rb')`, `files={'f': open(...)}`, `read_bytes()`). The rule matches by SHAPE — it also fires on non-secret files and on `json=json.load(open(<file>))` bodies — and it does not cover inline bodies (`json={...}`, `data=b'...'`), non-HTTP interpreters, or a hidden API name. Override to warn level if a legitimate workflow needs it."
    match:
      type: pattern
      # HTTP client call + a LOCAL-FILE read as the body. Inline bodies
      # (`json={...}`, `data=b'...'`) stay allowed.
      pattern: "(?=[\\s\\S]*(?:urlopen\\s*\\(|requests\\s*\\.\\s*(?:post|put|patch)\\s*\\(|httpx\\s*\\.\\s*(?:post|put|patch)\\s*\\(|http\\s*\\.\\s*client\\s*\\.|urllib\\s*\\.\\s*request\\s*\\.\\s*Request\\s*\\(|\\.request\\s*\\(\\s*['\\\"](?:POST|PUT|PATCH)['\\\"]))(?=[\\s\\S]*(?:open\\s*\\([^)]*\\)\\s*\\.read(?:lines)?\\s*\\(|open\\s*\\([^)]*,\\s*['\\\"][rb]{1,2}['\\\"]|read_bytes\\s*\\(|read_text\\s*\\())"

  # ---------------------------------------------------------------------------
  # DF-TERMINAL-JAIL-20 local-file upload / whole-tree copy. These four were
  # priority-700 auto-sandbox rules described as "staged exfil" coverage; the
  # namespace wrap does not restrict network access (a sandboxed `curl -T`
  # still reached a live collector), so they are BLOCK rules now and the
  # decider's whole-command pass settles them before any per-segment layer.
  # Verdict change: these shapes were `modify`, they are now `block`.
  # Patterns are byte-identical to the engine constants (gated by
  # scripts/yaml-mirror-parity-probe.py).
  # ---------------------------------------------------------------------------
  - id: "builtin-net-curl-upload"
    description: "curl upload of a local file (file exfiltration)"
    priority: 1000
    action: block
    block_message: "Blocked: curl sending a LOCAL FILE out as the request body (`-T`/`--upload-file`/`-sT`, `-d`/`--data`/`--data-binary`/`--data-raw`/`--data-urlencode` reading a `@file`). The rule matches by SHAPE — it also fires on non-secret files and on any destination, URL or not — and it does not cover a payload that never exists on disk (inline `-d '{...}'`, `--data-binary '{...}'`, a helper script that assembles the body, or curl reading a config file). Inline bodies and plain downloads keep their ALLOW verdict; override to warn level if a legitimate workflow uploads files."
    match:
      type: pattern
      # -T/--upload-file in the bare, clustered (-sT), attached (-T/path) and
      # `=`-joined spellings; --data/--data-binary/--data-raw/--data-urlencode
      # (+ --data-ascii) with `@file`; a clustered short data flag with `@file`;
      # and --data-urlencode's named `name@file` form.
      # The quote-aware gap `(?:[^|;&]|'[^']*'|"[^"]*")*?` spans a QUOTED
      # `&` (a URL query string) but still stops at an unquoted operator.
      # Inline bodies (`-d '{...}'`, `--data-binary '{...}'`) are not matched.
      pattern: "(?<![\\w.-])curl\\b(?:[^|;&]|'[^']*'|\\\"[^\\\"]*\\\")*?(?:(?<![\\w-])-[A-Za-z]*T\\b|--upload-file\\b)|(?<![\\w.-])curl\\b(?:[^|;&]|'[^']*'|\\\"[^\\\"]*\\\")*?--data(?:-binary|-raw|-urlencode|-ascii)?[= ]@\\S+|(?<![\\w.-])curl\\b(?:[^|;&]|'[^']*'|\\\"[^\\\"]*\\\")*?(?<![\\w-])-[A-Za-z]*d\\b\\s*@\\S+|(?<![\\w.-])curl\\b(?:[^|;&]|'[^']*'|\\\"[^\\\"]*\\\")*?--data-urlencode\\s+[^\\s@|=]+@\\S+"

  - id: "builtin-net-wget-post-file"
    description: "wget POST of a local file (file exfiltration)"
    priority: 1000
    action: block
    block_message: "Blocked: wget posting a LOCAL FILE as the request body (`--post-file=<file>` / `--body-file=<file>`, space- or `=`-joined). The rule matches by SHAPE — it also fires on non-secret files and on any destination — and it does not cover wget's inline `--post-data`, plain downloads (`wget <url>`, `wget -O <path> <url>`), or a body assembled by a helper script. Override to warn level if a legitimate workflow posts files."
    match:
      type: pattern
      # wget's file-body POST: `--post-file=<path>` / `--body-file=<path>`
      # (space form accepted too). Inline `--post-data` is not matched.
      pattern: "(?<![\\w.-])wget\\b(?:[^|;&]|'[^']*'|\\\"[^\\\"]*\\\")*?(?<![\\w-])--(?:post-file|body-file)[= ]\\S+"

  - id: "builtin-net-curl-form-upload"
    description: "curl multipart form upload of a local file (file exfiltration)"
    priority: 1000
    action: block
    block_message: "Blocked: curl sending a LOCAL FILE as a multipart form field (`-F`/`--form` with a `name=@file` upload or a content-only `name=<file` body). The rule matches by SHAPE — it also fires on non-secret files and on any destination — and it does not cover inline fields (`curl -F 'name=value'`), curl's literal `--form-string`, or a payload assembled by a helper script. Inline multipart keeps its ALLOW verdict; override to warn level if a legitimate workflow uploads files as form fields."
    match:
      type: pattern
      # -F/--form (separated, `=`-joined, attached or clustered as in `-sF`)
      # whose field value carries a curl file-payload sigil: `name=@path`
      # (upload with filename) or `name=<path` (content-only). Inline fields
      # (`-F 'name=value'`, `--form-string 'f=@notafile'`) are not matched.
      # Two deliberate choices: `(?-i:-[A-Za-z]*F\b)` keeps the short flag
      # case-sensitive under the matcher's re.IGNORECASE (so `curl -fsSL` is
      # never read as a form upload), and the quote-aware gap (see the
      # curl-upload entry) spans a quoted `&` without crossing a real operator.
      pattern: "(?<![\\w.-])curl\\b(?:[^|;&]|'[^']*'|\\\"[^\\\"]*\\\")*?(?:(?-i:-[A-Za-z]*F\\b)|--form)(?![-\\w])(?:=|\\s+)?[^|;&\\s]*=(?:@|<)\\S+"

  - id: "builtin-net-remote-tree-copy"
    description: "Whole-tree or secret-source remote copy (root / secret-bearing source to a remote host)"
    priority: 1000
    action: block
    block_message: "Blocked: `rsync`/`scp` remote copy of (a) the WHOLE TREE — a source that is the filesystem root (a bare `/` token in the `//`, `/*`, `/.` spellings) — or (b) a SECRET-BEARING SOURCE — any source path containing a `~`, `.ssh`/`.gnupg`/`.aws`/`.config`/`.env` component, or an `id_rsa`/`id_ed25519`/`known_hosts`/`credentials` file name (bare, relative, or inside an absolute path) — sent to a `host:path` / `host::module` destination. The rule matches by SHAPE — it also fires on non-secret trees and on any remote destination, including a legitimate backup host — and it does not cover a scoped non-secret directory copy (`rsync -a /srv/data/ host:/srv/backup/`, `scp file host:/srv/file`, a root-to-LOCAL or secret-to-LOCAL copy) nor a `=`-joined option VALUE that merely mentions a secret path (`-o IdentityFile=~/.ssh/id_rsa`). Override to warn level if a backup workflow needs one of these shapes."
    match:
      type: pattern
      # Two arms (patterns are byte-identical to the engine constants — gated
      # by scripts/yaml-mirror-parity-probe.py):
      # ARM 1 — whole tree: <rsync|scp> <flags> <root source> ... <host:path>;
      # the SOURCE is a standalone root token (`/`, `//`, `/*`, `/.` — a `/`
      # preceded by `~` does NOT arm it: source lookbehind `(?<![\\w/~])`),
      # the destination a remote `host:path`. The `~/` whole-home spelling
      # and every secret-bearing HOME source arm through ARM 2 below.
      # ARM 2 — secret source (DF-TERMINAL-JAIL-29): <rsync|scp> <flags>
      # <source containing a secret component> ... <remote dest>: a bare `~`
      # whole-home token, a `.ssh`/`.gnupg`/`.aws`/`.config`/`.env` component
      # (dot-relative, `~/`-prefixed, or inside an absolute path), or the key
      # file names `id_rsa`/`id_ed25519`/`known_hosts`/`credentials` (bare or
      # path-embedded, never a longer name). The `=`-guard keeps
      # `-o IdentityFile=~/.ssh/id_rsa` (option VALUE) out of the arm; the
      # destination must be remote (`something:` non-empty, no `/`, not a bare
      # `~` — bracketed IPv6 `[...]:` and rsync `host::module` included), so a
      # secret-to-LOCAL copy stays ALLOW.
      pattern: "(?<![\\w.-])(?:rsync|scp)\\b[^|;&]*(?<![\\w/~])(?:/{1,2})(?![\\w/])[^|;&]*\\s[^\\s|;&]+:|(?<![\\w.-])(?:rsync|scp)\\b[^|;&]*\\s[^=\\s|;&]*(?:~(?![\\w./+-])|~/(?![\\w.])|/~?\\.(?:ssh|gnupg|aws|config|env)(?![\\w-])|(?<![\\w./+-=])\\.(?:ssh|gnupg|aws|config|env)(?![\\w-])|(?<![\\w])/?(?:id_rsa|id_ed25519|known_hosts|credentials)(?![\\w-]))[^|;&]*\\s(?:\\[[^\\]\\s|;&]+\\]|[^\\s/|;&]+):"

  # =============================================================================
  # Auto-Sandbox (priority 700) — wrap in unshare namespace, never block
  # =============================================================================
  - id: "auto-pytest"
    description: "Python test runner"
    priority: 700
    action: sandbox
    block_message: "Auto-sandboxed: pytest running in isolated namespace."
    match:
      type: pattern
      pattern: "pytest|tox|nose"

  - id: "auto-npm-test"
    description: "JavaScript test runner"
    priority: 700
    action: sandbox
    block_message: "Auto-sandboxed: JS test runner in isolated namespace."
    match:
      type: pattern
      pattern: "npm\\s+test|npx\\s+(vitest|jest)"

  - id: "auto-go-test"
    description: "Go test runner"
    priority: 700
    action: sandbox
    block_message: "Auto-sandboxed: Go test runner in isolated namespace."
    match:
      type: pattern
      pattern: "go\\s+test"

  - id: "auto-make"
    description: "Build system"
    priority: 700
    action: sandbox
    block_message: "Auto-sandboxed: build tool in isolated namespace."
    match:
      type: pattern
      pattern: "make\\s|make$"

  - id: "auto-pip"
    description: "Package installer"
    priority: 700
    action: sandbox
    block_message: "Auto-sandboxed: package installer in isolated namespace."
    match:
      type: pattern
      pattern: "pip\\s+install|pip3\\s+install"

  - id: "auto-cargo"
    description: "Rust build tool"
    priority: 700
    action: sandbox
    block_message: "Auto-sandboxed: Rust build in isolated namespace."
    match:
      type: pattern
      pattern: "cargo\\s+(build|test)"

  - id: "auto-gcc"
    description: "C/C++ compilation"
    priority: 700
    action: sandbox
    block_message: "Auto-sandboxed: compilation in isolated namespace."
    match:
      type: pattern
      pattern: "gcc\\s|g\\+\\+\\s|clang\\+\\+\\s"

  - id: "auto-script"
    description: "Script execution"
    priority: 700
    action: sandbox
    block_message: "Auto-sandboxed: script execution in isolated namespace."
    match:
      type: pattern
      pattern: "\\./(.+\\.(sh|py|rb|zsh|bash|ksh)|[^/]+\\.(sh|py|rb|zsh|bash|ksh))|\\b(bash|sh|dash|zsh|python3?|ksh)\\s+[^\\s|;&]+\\.(sh|py|rb|zsh|bash|ksh)"

  # ---------------------------------------------------------------------------
  # TJ-GAP-058 network egress. The fetch-pipe companion below stays a
  # namespace-wrap rule (it is a download-execute shape, not a data-out one).
  # Container-neutral for egress: the wrap does NOT restrict network access
  # and is not claimed to prevent exfiltration (see the DF-TERMINAL-JAIL-20
  # block rules below for the upload shapes).
  # ---------------------------------------------------------------------------
  - id: "builtin-net-fetch-pipe-qualified"
    description: "Fetch pipeline into a path-qualified or wrapped interpreter"
    priority: 700
    action: sandbox
    block_message: "Auto-sandboxed: downloaded script piped into a path-qualified/wrapped shell (namespace isolation, command still runs)."
    match:
      type: pattern
      # Companion to builtin-curl-pipe-shell, which blocks the BARE
      # interpreter form `curl <url> | sh`. Path-qualified / wrapped
      # interpreters stay in the dual-use tier and get the namespace wrap.
      pattern: "^\\s*(?:(?:env|busybox|setsid|xargs)\\s+(?:-{1,2}[A-Za-z0-9-]+\\s+)*)?(?:/usr)?/bin/(?:bash|sh|dash|zsh|ksh)\\b(?:\\s+(?:-{1,2}[A-Za-z0-9-]+|\\d?>&?\\d+))*\\s*$|^\\s*(?:env|busybox|setsid|xargs)\\s+(?:-{1,2}[A-Za-z0-9-]+\\s+)*(?:bash|sh|dash|zsh|ksh)\\b(?:\\s+(?:-{1,2}[A-Za-z0-9-]+|\\d?>&?\\d+))*\\s*$|(?<![\\w.-])(?:curl|wget)\\b[^|;&]*\\|\\s*(?:(?:env|busybox|setsid|xargs)\\s+)?(?:/usr)?/bin/(?:bash|sh|dash|zsh|ksh)\\b|(?<![\\w.-])(?:curl|wget)\\b[^|;&]*\\|\\s*(?:env|busybox|setsid|xargs)\\s+(?:bash|sh|dash|zsh|ksh)\\b"

  # =============================================================================
  # Always-Allow (priority 500) — never block, never sandbox
  # =============================================================================
  - id: "allow-echo"
    description: "Safe text output"
    priority: 500
    action: allow
    match:
      type: pattern
      pattern: "^echo\\s"

  - id: "allow-ls"
    description: "Directory listing"
    priority: 500
    action: allow
    match:
      type: pattern
      pattern: "^ls\\b"

  - id: "allow-pwd"
    description: "Print working directory"
    priority: 500
    action: allow
    match:
      type: pattern
      pattern: "^pwd$"

  - id: "allow-cat-safe"
    description: "Safe file reads (non-sensitive paths)"
    priority: 500
    action: allow
    match:
      type: pattern
      pattern: "^cat\\s(?!.*/(etc|boot|proc|sys))"

  - id: "allow-grep"
    description: "Text search"
    priority: 500
    action: allow
    match:
      type: pattern
      pattern: "^grep\\s"

  - id: "allow-find-safe"
    description: "File search without -exec/-delete"
    priority: 500
    action: allow
    match:
      type: pattern
      pattern: "^find\\s(?!.*-exec)(?!.*-delete)"

  - id: "allow-git-read"
    description: "Git read operations"
    priority: 500
    action: allow
    match:
      type: pattern
      pattern: "^git\\s+(status|log|diff)\\b"

  - id: "allow-python-version"
    description: "Python version check"
    priority: 500
    action: allow
    match:
      type: pattern
      pattern: "^python.*--version"

  - id: "allow-which"
    description: "Path resolution"
    priority: 500
    action: allow
    match:
      type: pattern
      pattern: "^(which|command\\s+-v)\\s"

  - id: "allow-cd"
    description: "Directory change"
    priority: 500
    action: allow
    match:
      type: pattern
      pattern: "^cd\\s"
