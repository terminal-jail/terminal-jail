name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install pytest-cov
          pip install pyyaml

      - name: Run tests (unit only, skip integration)
        # Coverage floor = measured baseline (74.82% CI-scope on 2026-10-02, host venv 3.11;
        # README "Development > Coverage" records the numbers). Floor sits at/below the
        # measured value on purpose — a regression guard, not an aspirational target.
        run: |
          pytest plugin/ tests/ -v --tb=short -m "not integration" --cov=terminal_jail --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=74

      - name: Upload coverage artifact
        # machine-readable coverage report (INT-CI-2 criterion 4); the
        # human-readable TOTAL prints in the step above. `if: always()` so the
        # report uploads even when the floor trips.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Validate canonical board task IDs
        run: python scripts/board_id_guard.py

      - name: GTFOBins sweep (posture coverage + drift guard)
        run: python scripts/gtfobins-sweep.py --check

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install 'ruff==0.16.8'

      - name: Run ruff
        run: ruff check plugin/ --output-format=github

      - name: Run ruff format check
        run: ruff format --check .

  audit:
    name: Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit

  drift-guards:
    name: Drift guards (rule catalog + mirror parity + probes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Rule catalog drift check
        run: python scripts/rule-catalog.py --check

      - name: YAML mirror parity probe (shipped rules vs engine constants)
        run: python scripts/yaml-mirror-parity-probe.py

      - name: Installed-rules drift probe (CI gate mode)
        run: python scripts/rules-drift-probe.py --fail-on-drift

      - name: Backend parity battery (evidence collection, always exits 0)
        run: python scripts/backend-parity-battery.py --json

      - name: TJ-DF-043 orphan-teardown gate (fails only on an OBSERVED orphan)
        # Red exactly when this runner's kernel orphans the payload; a runner
        # whose wrapper fails closed (no namespaces) SKIPs honestly (exit 0,
        # reason printed) — a skip is never counted as a pass.
        run: python scripts/kernel-matrix-teardown.py --gate
