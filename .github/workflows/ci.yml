name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install pyyaml

      - name: Run tests (unit only, skip integration)
        run: |
          pytest plugin/ tests/ -v --tb=short -m "not integration"

      - name: Validate canonical board task IDs
        run: python scripts/board_id_guard.py

      - name: GTFOBins sweep (posture coverage + drift guard)
        run: python scripts/gtfobins-sweep.py --check

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install 'ruff==0.16.8'

      - name: Run ruff
        run: ruff check plugin/ --output-format=github

      - name: Run ruff format check
        run: ruff format --check .

  audit:
    name: Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit

  drift-guards:
    name: Drift guards (rule catalog + mirror parity + probes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Rule catalog drift check
        run: python scripts/rule-catalog.py --check

      - name: YAML mirror parity probe (shipped rules vs engine constants)
        run: python scripts/yaml-mirror-parity-probe.py

      - name: Installed-rules drift probe (CI gate mode)
        run: python scripts/rules-drift-probe.py --fail-on-drift

      - name: Backend parity battery (evidence collection, always exits 0)
        run: python scripts/backend-parity-battery.py --json
