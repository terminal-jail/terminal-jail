# /etc/systemd/system/hermes-gateway.service.d/90-terminal-jail-hardening.conf
# Defense-in-depth for terminal-jail / Hermes gateway.
# ⚠️ LIGHTWEIGHT HARDENING (14 active directives) — NOT a PID namespace
# isolation boundary. Active: ProtectProc=invisible, NoNewPrivileges=true,
# ProtectControlGroups=true, TasksMax=256, RestrictSUIDSGID=true,
# RestrictRealtime=true, ProtectClock=true, ProtectHostname=true,
# ProtectKernelLogs=true, ProtectKernelModules=true,
# ProtectKernelTunables=true, LockPersonality=true,
# MemoryDenyWriteExecute=true, SystemCallArchitectures=native. The commented
# directives below are the full hardening profile, staged for per-host
# verification (see docs/deploy-to-karahermes.md and specs/systemd.md for the
# full profile).
# The plugin is observability-only and this drop-in does NOT create a PID
# namespace — for PID namespace containment use the standalone CLI or a
# verified full-profile deployment.

[Service]
# === SAFE — active ===
# Namespace and process-visibility containment
ProtectProc=invisible

# Privilege containment
NoNewPrivileges=true

# Protect the host cgroup hierarchy from a compromised descendant.
ProtectControlGroups=true

# Bound an agent loop or fork bomb before it can exhaust the host.
TasksMax=256

# Kernel-interface hardening — zero-risk for this gateway: no filesystem,
# network, namespace, or memory-budget footprint (tier-2 defense-in-depth).

# Deny setuid/setgid bit manipulation on files.
RestrictSUIDSGID=true

# Deny realtime scheduling requests.
RestrictRealtime=true

# Deny writes to the system and hardware clock.
ProtectClock=true

# Deny hostname changes.
ProtectHostname=true

# Deny access to the kernel log ring buffer.
ProtectKernelLogs=true

# Deny kernel module loading.
ProtectKernelModules=true

# Make kernel tunables (/proc/sys, /sys) read-only.
ProtectKernelTunables=true

# Lock the process execution domain (personality).
LockPersonality=true

# Deny new writable-and-executable memory mappings.
MemoryDenyWriteExecute=true

# Restrict syscall architectures to the native set.
SystemCallArchitectures=native

# === GRADUAL — commented, needs verification ===
# PrivateUsers=true
#   Risk: changes UID mapping. Verify gateway still accesses /home/kara/.hermes after.

# RestrictNamespaces=true
#   Risk: prevents creating new PID namespaces, which is the GOAL of terminal-jail.
#   But the gateway itself may need userns for plugin sandboxing. Test first.

# CapabilityBoundingSet=
#   Risk: empty cap set. Gateway may need CAP_SYS_ADMIN or others.

# === DANGEROUS — commented with rationale ===
# RestrictAddressFamilies=~AF_INET AF_INET6 AF_NETLINK
#   FATAL: Gateway needs TCP/IP for API calls (OpenRouter, DeepSeek, etc.)
#   and Telegram bot API. Cannot restrict AF_INET/AF_INET6.
#   Consider RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK instead.

# ProtectSystem=strict
# ProtectHome=true
#   FATAL: Gateway config and state live under /home/kara/.hermes/.
#   ProtectHome=true blocks all of /home. ProtectSystem=strict makes /usr read-only
#   which is fine but combined with ProtectHome blocks gateway operation.
#   ReadWritePaths points to non-existent directories (/var/lib/hermes etc.).

# ReadWritePaths=/var/lib/hermes
# ReadWritePaths=/var/log/hermes
# ReadWritePaths=/var/lib/terminal-jail
#   These directories don't exist. Gateway uses /home/kara/.hermes/ for state.
#   Create directories first or update paths.

# MemoryMax=1G
#   FATAL: Gateway RSS is 1.5GB+. MemoryMax=1G would OOM-kill on restart.
#   Current gateway configuration uses MemoryMax=32G, MemoryHigh=24G.
#   Do NOT override — use the gateway's own memory limits.

# === ROLLBACK PROCEDURE ===
# If this drop-in causes issues (gateway fails to start, API unreachable,
# Telegram bot stops responding), remove it and restart:
#
#   sudo rm /etc/systemd/system/hermes-gateway.service.d/90-terminal-jail-hardening.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart hermes-gateway.service
#
# Verify recovery:
#   systemctl is-active hermes-gateway.service   # must print "active"
#   journalctl -u hermes-gateway.service -n 20 --no-pager  # check for errors
#
# Total downtime: <10 seconds (daemon-reload + restart).
# No data loss: all gateway state is on disk under /home/kara/.hermes/.
#
# AFTER rollback: leave the file removed. Do NOT re-add it until the
# specific directive that caused the failure is identified and fixed.
# Test in a staging gateway instance before redeploying.
#
# If only a specific directive is problematic (not the entire file):
#   1. Comment out the failing directive in this file
#   2. sudo systemctl daemon-reload
#   3. sudo systemctl restart hermes-gateway.service
#   4. File an issue with the failing directive + journalctl output
