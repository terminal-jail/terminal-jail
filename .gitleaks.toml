# GitReins — gitleaks configuration
# Auto-generated by 'gitreins init'. Edit to add project-specific exclusions.
# See: https://github.com/gitleaks/gitleaks#configuration

# Catch all sk- prefixed API keys (OpenAI, OpenRouter, DeepSeek, etc.)
# 20+ chars — lower than gitleaks' default 32-char minimum
[[rules]]
id = "sk-api-key"
description = "OpenAI/OpenRouter/DeepSeek API key (sk- prefix)"
regex = '''(?i)sk-[a-zA-Z0-9_-]{20,}'''

[allowlist]
description = "Auto-generated by gitreins init — skip dependency dirs, docs, specs"

# .coding-hermes/ = the fleet task board (harness state, like .gitreins/**): its events
# quote trace markers whose word breaks trip the sk- rule (e.g. 'ta|sk-complete-...').
# commits= allowlists only apply to git-history scans; the Tier-1 secrets step runs a
# --no-git WORKING-TREE scan, which needs a path exclusion instead.
paths = [
  '''.coding-hermes/''',
  '''.git/''',
  '''.gitreins/history/''',
  '''.gitreins/logs/''',
  '''.*\\.log$''',
  '''.venv/''',
  '''venv/''',
  '''__pycache__/''',
  '''.*\\.egg-info/''',
  '''dist/''',
  '''build/''',
  '''.mypy_cache/''',
  '''.pytest_cache/''',
  '''.ruff_cache/''',
  '''specs/''',
  '''docs/''',
  '''.*\\.spec\\.md$''',
  '''.*\\.md$''',
]
